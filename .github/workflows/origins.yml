name: Player origins browser QA
on:
  push:
    branches: ['codex/v0.13-player-stories']
defaults:
  run:
    working-directory: Soccer_Career_New_Era
jobs:
  origins:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Soccer_Career_New_Era/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Candidate flow and retirement persistence on PC, mobile and WebKit
        run: WEBKIT=1 PWA_TEST=1 npx playwright test tests/e2e/v13.spec.ts tests/e2e/v05.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: origins-browser-results
          path: |
            Soccer_Career_New_Era/reports/
            Soccer_Career_New_Era/test-results/
