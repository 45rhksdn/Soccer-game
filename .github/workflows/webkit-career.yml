name: WebKit career regression
on:
  push:
    branches: ['codex/v0.9-world-transfers']
    paths: ['Soccer_Career_New_Era/tests/e2e/career.spec.ts', '.github/workflows/webkit-career.yml']
jobs:
  career:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: Soccer_Career_New_Era
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Soccer_Career_New_Era/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: WEBKIT=1 npx playwright test tests/e2e/career.spec.ts --grep 'daily schedule' --project=iphone-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-career-results
          path: |
            Soccer_Career_New_Era/test-results/
            Soccer_Career_New_Era/reports/
