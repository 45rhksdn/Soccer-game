name: Living football focused QA
on:
  push:
    branches: ['codex/v016-living-football']
defaults:
  run:
    working-directory: Soccer_Career_New_Era
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Soccer_Career_New_Era/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/living-football.test.ts tests/stories-assists.test.ts tests/finishing-carry.test.ts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: WEBKIT=1 PWA_TEST=1 npx playwright test tests/e2e/living-football.spec.ts tests/e2e/sidebar.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-football-results
          path: |
            Soccer_Career_New_Era/reports/
            Soccer_Career_New_Era/test-results/
