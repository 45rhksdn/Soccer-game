name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Soccer_Career_New_Era
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Soccer_Career_New_Era/package-lock.json
      - run: npm ci
      - name: Type-check and production build
        run: npm run build
      - name: Unit, regression and balance tests
        run: npm test
